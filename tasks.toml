#
# Repo-local tasks, included after the toolchain's common tasks: the
# manifests validation harness and the terraform module test suites. lint
# stays common's (license headers, prose, actionlint + zizmor, shell, and
# the kustomize config scans through the lint-kustomize replacement below);
# fmt is common's plus terraform fmt.

[test]
description = "render + schema-validate the manifests, then terraform test the modules"
run = [{ task = "test-manifests" }, { task = "test-modules" }]

[test-manifests]
description = "kustomize build, cluster-vars + patchy-vars substitution, resourceset render, kubeconform"
dir = "{{config_root}}"
run = "./scripts/validate.sh"

# modules/aws and modules/google call the cluster modules' modules/application
# from git, so init needs network (the providers are mocked, nothing else is
# reached).
[test-modules]
description = "terraform test (mocked providers) for modules/aws, modules/google and modules/scc-notifications"
dir = "{{config_root}}"
run = """
set -eu
for dir in modules/aws modules/google modules/scc-notifications; do
  echo "==> $dir"
  {{vars.terraform_binary}} -chdir="$dir" init -backend=false -input=false > /dev/null
  {{vars.terraform_binary}} -chdir="$dir" validate
  {{vars.terraform_binary}} -chdir="$dir" test
done
"""

[fmt-terraform]
hide = true
dir = "{{config_root}}"
run = "{{vars.terraform_binary}} fmt -recursive modules"

[fmt]
description = "format prose and terraform, inject license headers"
run = [{ task = "fmt-prose" }, { task = "fmt-terraform" }, { task = "license" }]

# Repo-local replacement for the toolchain's lint-kustomize: kubescape
# fatals on directories that contain ONLY custom resources it cannot map.
# manifests/flux is Flux objects only and manifests/deploy/common is CRs
# plus Namespaces; the per-cloud overlays carry the ServiceAccounts and
# ConfigMaps kubescape can score.
[lint-kustomize]
hide = true
dir = "{{config_root}}"
env = { KUBESCAPE_SEVERITY = "{{vars.kubescape_severity}}" }
run = """
set -eu
export KUBECONFIG=/nonexistent
for d in manifests/deploy/aws/ manifests/deploy/google/; do
  echo "lint-kustomize: kubescape scan $d"
  kubescape scan "$d" --logger warning --severity-threshold "${KUBESCAPE_SEVERITY:-high}" --exceptions .kubescape/exceptions.json
done
"""

[ci]
description = "the checks the reusable CI workflow runs"
run = [{ task = "lint" }, { task = "test" }]

# common's pr is fmt + lint; this one adds the harness and the module tests.
[pr]
description = "full local gate before a pull request"
run = [{ task = "fmt" }, { task = "lint" }, { task = "test" }]
