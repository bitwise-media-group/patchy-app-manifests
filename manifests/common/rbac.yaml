# The platform's RBAC groups -> patchy's chart-rendered roles. The subject
# groups arrive as RBAC_GROUP_* cluster vars (empty string when the role is
# unbound or RBAC is off - see the cluster modules' var.rbac); the
# cluster-wide bindings (cluster-admin, edit, view) are the platform's rbac
# component, this image binds only onto patchy's own ClusterRoles, in the
# patchy namespace, under patchy-* names. kustomize can't conditionally
# emit resources, so a ResourceSet template guards each binding: an empty
# group renders nothing rather than an invalid empty subject.
#
# The vars are read inline in the template text, never via spec.inputs:
# post-build substitution round-trips the manifest through YAML, re-typing
# input values on the way - an empty var becomes null (the key vanishes on
# apply, and the template engine's missingkey=error fails the build) and
# true/false become bools that break string comparison.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: patchy-rbac
  namespace: patchy
spec:
  resourcesTemplate: |
    << if ne "${RBAC_GROUP_ADMINS:=}" "" >>
    ---
    # admins on the status page: the operator surface plus the demo-tooling
    # verbs (replay, reset). The platform's cluster-admin binding already
    # passes the server's SubjectAccessReviews; this keeps the status-page
    # grant explicit and intact if the cluster-wide role is ever narrowed.
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: patchy-admins-findings-admin
      namespace: patchy
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: patchy-findings-admin
    subjects:
      - kind: Group
        apiGroup: rbac.authorization.k8s.io
        name: ${RBAC_GROUP_ADMINS}
    << end >>
    << if ne "${RBAC_GROUP_VIEWERS:=}" "" >>
    ---
    # viewers on the status page: native get on findings opens the
    # dashboard read gate, nothing grants the action verbs.
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: patchy-viewers-findings-viewer
      namespace: patchy
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: patchy-findings-viewer
    subjects:
      - kind: Group
        apiGroup: rbac.authorization.k8s.io
        name: ${RBAC_GROUP_VIEWERS}
    << end >>
    << if ne "${RBAC_GROUP_DEVELOPERS:=}" "" >>
    ---
    # developers: the full status-page surface in the patchy namespace -
    # get/list on findings + findingrollups plus the custom verbs
    # (approve, suspend, resume) the server's SubjectAccessReviews check.
    # The role is chart-rendered (statusServer.rbac.userRoles in the
    # patchy HelmRelease) so the verb grammar tracks the app.
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: patchy-developers-findings-operator
      namespace: patchy
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: patchy-findings-operator
    subjects:
      - kind: Group
        apiGroup: rbac.authorization.k8s.io
        name: ${RBAC_GROUP_DEVELOPERS}
    << if eq "${PATCHY_EVALUATION:=false}" "true" >>
    ---
    # developers on the evaluation API: submit evaluation units and watch
    # their runs. Same tier as the findings-operator grant above; admins
    # need no binding - cluster-admin already passes the server's
    # SubjectAccessReviews. The role is chart-rendered
    # (evaluationController.rbac.userRoles in the patchy HelmRelease).
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: patchy-developers-evaluations-submitter
      namespace: patchy
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: patchy-evaluations-submitter
    subjects:
      - kind: Group
        apiGroup: rbac.authorization.k8s.io
        name: ${RBAC_GROUP_DEVELOPERS}
    << end >>
    << end >>
