# AWS Secrets Manager -> Kubernetes Secrets. Every sync is a
# SecretProviderClass/SecretSync pair materialising a Secret named after
# itself, carrying exactly the names and keys the patchy chart hardcodes,
# in the aws dialect: the Secrets Store CSI driver's AWS provider (the
# aws-secrets-store-csi-driver-provider EKS add-on) plus the upstream
# secrets-store-sync-controller this tree deploys as the secret-sync
# component - provider aws with IRSA (the syncs are podless, so Pod
# Identity's pod-bound token exchange can never succeed; see the
# secret-sync component), objectNames in Secrets Manager, SecretSync from
# secret-sync.x-k8s.io/v1alpha1.
#
# Every pair runs as the patchy-secrets KSAs (service-accounts.yaml); the
# secret VERSIONS are added out of band and never touch terraform state.
#
# The patchy-github sync is unconditional with the component; everything
# else is gated. The status server's sign-in is not synced from here: its
# dex client is a DexClient (../common/resourceset-dex.yaml) whose client
# secret the platform's dex-client-controller generates in-cluster.
#
# The agent harness credentials are gated: only the elected harnesses'
# containers exist, and a SecretProviderClass naming an absent container
# syncs nothing but errors forever. AGENT_HARNESSES is the
# same variable that enables the runners (agent.runners in the patchy
# core). The claude credential - since chart 0.10.0 consumed by the egress
# broker in the PATCHY namespace, not patchy-agents - is doubly
# conditional: on the harness, and on the model provider being anthropic (a
# cloud-provider cluster authenticates with its cloud identity and needs no
# anthropic container at all).
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: patchy-secrets
  namespace: patchy
spec:
  inputs:
    - harnesses: "${AGENT_HARNESSES:=claude}"
      claudeProvider: "${CLAUDE_PROVIDER:=anthropic}"
  resourcesTemplate: |
    ---
    # One GitHub credential Secret, referenced by the Integration CR (webhook
    # validation + issue projection + alert ingestion) and the Forge CR
    # (repository clone/push) alike. The key names appID / privateKey /
    # webhookSecret are patchy's contract (internal/ghsecret); the three
    # secret containers stay as terraform created them.
    apiVersion: secrets-store.csi.x-k8s.io/v1
    kind: SecretProviderClass
    metadata:
      name: patchy-github
      namespace: patchy
    spec:
      provider: aws
      parameters:
        region: ${AWS_REGION}
        usePodIdentity: "false"
        objects: |
          - objectName: "${SECRET_PREFIX}patchy-github-app-id"
            objectType: "secretsmanager"
            objectAlias: "app-id"
          - objectName: "${SECRET_PREFIX}patchy-github-app-private-key"
            objectType: "secretsmanager"
            objectAlias: "private-key.pem"
          - objectName: "${SECRET_PREFIX}patchy-webhook-secret"
            objectType: "secretsmanager"
            objectAlias: "webhook-secret"
    ---
    apiVersion: secret-sync.x-k8s.io/v1alpha1
    kind: SecretSync
    metadata:
      name: patchy-github
      namespace: patchy
    spec:
      serviceAccountName: patchy-secrets
      secretProviderClassName: patchy-github
      secretObject:
        type: Opaque
        data:
          - sourcePath: app-id
            targetKey: appID
          - sourcePath: private-key.pem
            targetKey: privateKey
          - sourcePath: webhook-secret
            targetKey: webhookSecret
    << if and (has "claude" (splitList "," inputs.harnesses)) (eq inputs.claudeProvider "anthropic") >>
    ---
    # The Anthropic credential (a `claude setup-token` OAuth token), consumed
    # by the egress broker - hence the patchy namespace, not patchy-agents;
    # the broker is its only consumer. Path/key api-key and Secret name
    # patchy-anthropic are the chart's defaults (egressBroker.anthropicSecret),
    # so neither is restated there.
    apiVersion: secrets-store.csi.x-k8s.io/v1
    kind: SecretProviderClass
    metadata:
      name: patchy-anthropic
      namespace: patchy
    spec:
      provider: aws
      parameters:
        region: ${AWS_REGION}
        usePodIdentity: "false"
        objects: |
          - objectName: "${SECRET_PREFIX}patchy-anthropic-token"
            objectType: "secretsmanager"
            objectAlias: "api-key"
    ---
    apiVersion: secret-sync.x-k8s.io/v1alpha1
    kind: SecretSync
    metadata:
      name: patchy-anthropic
      namespace: patchy
    spec:
      serviceAccountName: patchy-secrets
      secretProviderClassName: patchy-anthropic
      secretObject:
        type: Opaque
        data:
          - sourcePath: api-key
            targetKey: api-key
    << end >>
    << if has "codex" (splitList "," inputs.harnesses) >>
    ---
    # The OpenAI platform API key the codex CLI authenticates with. Key name
    # api-key and Secret name patchy-openai are the chart's runner defaults
    # (agent.runners.codex.secret / .secretKey), so neither is restated there.
    apiVersion: secrets-store.csi.x-k8s.io/v1
    kind: SecretProviderClass
    metadata:
      name: patchy-openai
      namespace: patchy-agents
    spec:
      provider: aws
      parameters:
        region: ${AWS_REGION}
        usePodIdentity: "false"
        objects: |
          - objectName: "${SECRET_PREFIX}patchy-openai-token"
            objectType: "secretsmanager"
            objectAlias: "api-key"
    ---
    apiVersion: secret-sync.x-k8s.io/v1alpha1
    kind: SecretSync
    metadata:
      name: patchy-openai
      namespace: patchy-agents
    spec:
      serviceAccountName: patchy-secrets
      secretProviderClassName: patchy-openai
      secretObject:
        type: Opaque
        data:
          - sourcePath: api-key
            targetKey: api-key
    << end >>
    << if has "copilot" (splitList "," inputs.harnesses) >>
    ---
    # The Copilot CLI's GitHub token - the one agent credential that is not
    # a model API key, and the reason this harness ships off. It must be a
    # fine-grained token with NO repository permissions (the CLI rejects
    # classic PATs outright); it is deliberately a different container from
    # the patchy-github App credential, which the agent pods must never see.
    # Key name token and Secret name patchy-copilot are the chart's runner
    # defaults.
    apiVersion: secrets-store.csi.x-k8s.io/v1
    kind: SecretProviderClass
    metadata:
      name: patchy-copilot
      namespace: patchy-agents
    spec:
      provider: aws
      parameters:
        region: ${AWS_REGION}
        usePodIdentity: "false"
        objects: |
          - objectName: "${SECRET_PREFIX}patchy-copilot-token"
            objectType: "secretsmanager"
            objectAlias: "token"
    ---
    apiVersion: secret-sync.x-k8s.io/v1alpha1
    kind: SecretSync
    metadata:
      name: patchy-copilot
      namespace: patchy-agents
    spec:
      serviceAccountName: patchy-secrets
      secretProviderClassName: patchy-copilot
      secretObject:
        type: Opaque
        data:
          - sourcePath: token
            targetKey: token
    << end >>
