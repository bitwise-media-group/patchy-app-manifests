# The identities the secret syncs run as, one per consuming namespace.
# modules/aws (through modules/application) attaches IRSA reader roles
# scoped to ${SECRET_PREFIX}* - IRSA rather than Pod Identity because the syncs are
# podless (see the platform's secret-sync component), and the role-arn
# annotations below are how the AWS provider finds each role; the secret
# VERSIONS are added out of band and never touch terraform state.
# The names are the contract with modules/aws's secret readers
# (patchy/patchy-secrets always; patchy-agents/patchy-secrets when a
# non-brokered harness is elected) - change them together or the grants
# silently stop matching. The agent-namespace account is rendered
# unconditionally: an annotation naming a role that does not exist is
# inert until a sync impersonates it, and only an elected harness's sync
# does.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patchy-secrets
  namespace: patchy
  annotations:
    eks.amazonaws.com/role-arn: ${SECRETS_ROLE_PREFIX}patchy-patchy-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patchy-secrets
  namespace: patchy-agents
  annotations:
    eks.amazonaws.com/role-arn: ${SECRETS_ROLE_PREFIX}patchy-agents-patchy-secrets
