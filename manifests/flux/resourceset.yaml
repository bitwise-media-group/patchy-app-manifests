# The newest admitted tag becomes a digest-pinned, signature-verified
# OCIRepository and the Kustomization that applies deploy/<tree> from it.
# Both objects are named by the seed contract (see input-provider.yaml).
# Everything patchy deploys hangs off Kustomization/patchy, so removing the
# seed (or the ResourceSet) prunes the whole application through the
# Kustomization's finalizer - which is the sanctioned uninstall.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: patchy-manifests
  namespace: flux-system
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: FluxInstance
      name: flux
      ready: true
  inputsFrom:
    - kind: ResourceSetInputProvider
      name: patchy-manifests
  resourcesTemplate: |
    ---
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: OCIRepository
    metadata:
      name: patchy-manifests
      namespace: flux-system
    spec:
      interval: 1h
      url: oci://${PLATFORM_REGISTRY}/manifests/patchy
      provider: "${OCI_PROVIDER:=gcp}"
      ref:
        tag: << inputs.tag >>
        << if and (hasKey inputs "digest") inputs.digest >>
        # the provider resolved the tag to a digest at listing time; pinning
        # it makes a retag between listing and pull a verification failure
        # rather than a silent swap
        digest: << inputs.digest >>
        << end >>
      verify:
        provider: cosign
        << if ne "${COSIGN_PUBLIC_KEY:=}" "" >>
        # Keyed clusters: the signing key's public half, distributed as the
        # flux-system cosign-pub Secret by the cluster bootstrap.
        secretRef:
          name: cosign-pub
        << else >>
        matchOIDCIdentity:
          # single-quoted: regexes whose backslashes a double-quoted scalar
          # would mangle when the rendered template text is parsed
          - issuer: '${SIGNED_IDENTITY_ISSUER:=^https://token\.actions\.githubusercontent\.com$}'
            subject: '${SIGNED_IDENTITY_PATCHY_MANIFESTS:=^https://github\.com/bitwise-media-group/patchy-app-manifests/\.github/workflows/publish\.yaml@refs/tags/v.+$}'
        << end >>
    ---
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: patchy
      namespace: flux-system
    spec:
      interval: 30m
      retryInterval: 2m
      # 10m rather than a workload's usual 5m: the first install also waits
      # on the secret syncs materialising the chart's Secrets; the retry
      # loop absorbs any remaining race.
      timeout: 10m
      wait: true
      prune: true
      # kyverno-policies: image verification (the platform policy plus the
      # PolicyException and ClusterPolicy this image ships) must be live
      # before pods admit. gateway: the HTTPRoutes attach to the platform
      # Gateway's wildcard listener. secret-sync (aws only): the SecretSync
      # CRD and controller must exist before the sync CRs; GKE ships its
      # Integrated Secret Synchronization with the cluster. dex (when
      # elected): the DexClient CRD and the dex-client-controller that
      # registers patchy's clients (deploy/common/resourceset-dex.yaml).
      dependsOn:
        - name: kyverno-policies
        - name: gateway
        << if eq "${PLATFORM_TREE}" "aws" >>
        - name: secret-sync
        << end >>
        << if has "dex" (splitList "," "${PLATFORM_COMPONENTS}") >>
        - name: dex
        << end >>
      sourceRef:
        kind: OCIRepository
        name: patchy-manifests
      path: ./deploy/${PLATFORM_TREE}
      postBuild:
        substituteFrom:
          - kind: ConfigMap
            name: cluster-vars
          # the application's own vars (terraform-reconciled by
          # modules/aws or modules/google, as the application-patchy-inputs
          # release); optional to flux, required in practice - see README
          - kind: ConfigMap
            name: patchy-vars
            optional: true
