# The identities the secret syncs run as, one per consuming namespace.
# Each KSA holds direct Workload Identity grants
# (roles/secretmanager.secretAccessor) that modules/google creates beside
# the secret containers; the secret VERSIONS are added out of band and never
# touch terraform state.
# The names are the contract with modules/google - change them
# together or the grants silently stop matching. They ride this companion
# rather than the patchy core because the syncs in resourceset-secrets.yaml
# impersonate them - the core depends on this Kustomization, so
# core-owned accounts could never exist in time on a fresh cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patchy-secrets
  namespace: patchy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patchy-secrets
  namespace: patchy-agents
