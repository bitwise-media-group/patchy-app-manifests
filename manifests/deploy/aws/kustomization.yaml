#
# The aws deploy tree: the cloud-neutral core, the image's self-definition
# (../../flux, so the seed objects are adopted and owned by this
# Kustomization), and the aws secret-sync dialect - Secrets Store CSI
# SecretProviderClass + secrets-store-sync SecretSync, run as the
# patchy-secrets KSAs whose IRSA reader roles modules/aws mints (through
# terraform-aws-eks-flux's modules/application).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../common
  - ../../flux
  - service-accounts.yaml
  - static-context.yaml
  - resourceset-secrets.yaml
