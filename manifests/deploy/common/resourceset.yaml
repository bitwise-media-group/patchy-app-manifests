# Patchy itself: two charts pulled straight from ghcr (generic provider,
# anonymous) and cosign keyless-verified against the patchy repo's own
# publish identity - unlike the platform components, which ride the
# flux-containers mirror. The patchy chart carries the CRDs and controllers;
# patchy-config carries the Integration/Forge CRs, split into its own release
# (upstream 0.5.0) because Helm validates every manifest against the API
# server before applying anything - a single release can never install a CRD
# and a CR of that CRD on first install. Both charts version in lockstep, so
# one input provider tag drives both. Every credential Secret - the
# unconditional patchy-github, and the gated patchy-anthropic and friends -
# is synced by the per-cloud overlay's resourceset-secrets.yaml, which rides
# the same Kustomization (helm-controller retries until the Secrets exist).
# The mocked CMDB and the status server's projected auth mount ride in via
# postRenderers because the chart has no extraVolumes knob. patchy's dex
# clients are DexClient objects (resourceset-dex.yaml), registered by the
# platform's dex-client-controller.
#
# Vars: PLATFORM_* and the rest of the platform contract come from
# cluster-vars; the app-owned vars (AGENT_*, CLAUDE_*, PATCHY_*) come from
# patchy-vars, published by the app module's vars output. dex is elected on
# the platform side (PLATFORM_COMPONENTS carries "dex" when the cluster's
# sso is on) and served at dex.<PLATFORM_DOMAIN>; patchy's own hosts are
# subdomains of PATCHY_DOMAIN, which must sit under the platform Gateway's
# wildcard listener (*.<PLATFORM_DOMAIN>) - the app module sets both from
# one value.
#
# The patchy-config HelmRelease is the one object that rides resourcesTemplate
# rather than resources below (flux-operator renders both and merges them),
# because its integrations list is COMPOSED, not just filled in: the
# google-cloud Integration exists only on a cluster whose terraform built the
# SCC pipeline. Templating inside `resources:` can only fill scalars -
# conditional membership of a list needs a text template. Rendering it with
# empty values instead is not an option: audience and serviceAccount are
# required with minLength 1 in both the chart's values schema and the CRD, so
# an unconfigured cluster would fail the release rather than fail closed at
# runtime.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: patchy
  namespace: patchy
spec:
  inputsFrom:
    - kind: ResourceSetInputProvider
      name: patchy
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: patchy
        namespace: patchy
      spec:
        interval: 1h
        url: oci://ghcr.io/bitwise-media-group/patchy/charts/patchy
        provider: generic
        ref:
          tag: << inputs.tag >>
        verify:
          provider: cosign
          matchOIDCIdentity:
            # ghcr artifacts are keyless-signed by GitHub workflows whatever
            # the platform's signing mode, so the issuer falls back to
            # GitHub Actions on KMS-keyed clusters, where the cluster-vars
            # convention publishes SIGNED_IDENTITY_ISSUER as the empty
            # string (:= fires on empty, not just unset).
            - issuer: '${SIGNED_IDENTITY_ISSUER:=^https://token\.actions\.githubusercontent\.com$}'
              # the chart is signed by patchy's own helm.yaml workflow; the
              # IMAGES are signed by the shared release workflow and carry a
              # different identity (SIGNED_IDENTITY_PATCHY_IMAGES in
              # policy.yaml); THIS image's manifests are signed by a third
              # (SIGNED_IDENTITY_PATCHY_MANIFESTS in ../../flux)
              subject: '${SIGNED_IDENTITY_PATCHY:=^https://github\.com/bitwise-media-group/patchy/}'
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: patchy
        namespace: patchy
      spec:
        interval: 30m
        timeout: 10m
        chartRef:
          kind: OCIRepository
          name: patchy
          namespace: patchy
        values:
          webhook:
            # the machine edge: GitHub delivers to the integration-controller
            # on its own hostname; the platform Gateway's wildcard listener
            # terminates TLS for it and admits routes from this namespace
            # (the gateway-access label on namespace.yaml). Routes attach by
            # hostname, so no sectionName.
            host: integrations.${PATCHY_DOMAIN}
            httpRoute:
              enabled: true
              parentRefs:
                - name: platform
                  namespace: gateway
          config:
            # demo visibility across every controller (the binaries default
            # to warn, which makes a healthy cluster look silent); revisit
            # once the demo settles
            logLevel: debug
          agent:
            # terraform pre-creates patchy-agents; namespace.yaml carries
            # the restricted Pod Security labels the chart would otherwise
            # stamp
            createNamespace: false
            # Which agent CLIs may run. The chart ships one runner per
            # harness - claude drives the Anthropic models, codex the OpenAI
            # ones, and copilot brokers both vendors' - each with its own
            # image, credential Secret and egress allowlist; a Job runs
            # whichever harness the model it was given resolves to.
            #
            # Electing a harness here is necessary but not sufficient: the
            # controllers probe each enabled runner's credential Secret at
            # startup and quietly drop the ones whose Secret is absent. That
            # is what makes naming a harness safe before its credential
            # lands - and why the SecretSyncs that materialise those Secrets
            # (the per-cloud overlay) key off this same variable.
            runners:
              claude:
                enabled: << has "claude" (splitList "," "${AGENT_HARNESSES:=claude}") >>
                # No credential here: claude is BROKERED, so the Anthropic
                # credential is consumed by the egress broker in THIS
                # namespace (egressBroker below; synced conditionally in
                # the per-cloud overlay) and nothing secret ever enters an
                # agent pod. Which model API the broker fronts is a cluster
                # decision, so every provider field rides a CLAUDE_* var.
                provider:
                  name: ${CLAUDE_PROVIDER:=anthropic}
                  # the chart's region field is shared across providers; the
                  # wire vars are provider-prefixed, so this picks the one
                  # matching the selected provider. Template-quoted (`| quote`
                  # renders "" into the template output): both vars may be
                  # empty, the strict schema wants a string, and a bare
                  # quoted dollar-brace scalar would round-trip to null through
                  # flux's post-build substitution when empty. Each app module
                  # publishes only its own cloud's pair, so both carry :=
                  # defaults for the tree where they are absent.
                  region: << ternary "${CLAUDE_BEDROCK_REGION:=}" "${CLAUDE_VERTEX_REGION:=}" (eq "${CLAUDE_PROVIDER:=anthropic}" "bedrock") | quote >>
                  # single-provider fields, so they map 1:1 from their vars;
                  # template-quoted for the same may-be-empty reason as
                  # region above
                  regionPrefix: << "${CLAUDE_BEDROCK_REGION_PREFIX:=}" | quote >>
                  projectID: << "${CLAUDE_VERTEX_PROJECT_ID:=}" | quote >>
                  # canonical-id -> provider-model-id overrides, wired as a
                  # flat "k=v,k=v" string (a ConfigMap value is a scalar) and
                  # rebuilt into a flow mapping here - same one-scalar-
                  # position trick as the annotations flow mapping below
                  modelMap: << if ne "${CLAUDE_MODEL_MAP:=}" "" >>{<< range $i, $pair := splitList "," "${CLAUDE_MODEL_MAP:=}" >><< if $i >>,<< end >>"<< index (splitList "=" $pair) 0 >>":"<< index (splitList "=" $pair) 1 >>"<< end >>}<< else >>{}<< end >>
              codex:
                # defaults: patchy-openai / api-key as OPENAI_API_KEY. The
                # CODEX_API_KEY and CODEX_ACCESS_TOKEN channels (a ChatGPT
                # workspace token rather than a platform API key) are only in
                # the chart's schema after 0.7.0 - raise the semver floor in
                # input-provider.yaml before selecting one.
                enabled: << has "codex" (splitList "," "${AGENT_HARNESSES:=claude}") >>
              copilot:
                # defaults: patchy-copilot / token as COPILOT_GITHUB_TOKEN.
                # Alone among the three this credential is a GitHub token, so
                # scope it to Copilot only - fine-grained, no repository
                # permissions. The runner passes --disable-builtin-mcps, so
                # nothing in the session can spend it as a forge.
                enabled: << has "copilot" (splitList "," "${AGENT_HARNESSES:=claude}") >>
            # Derived from AGENT_HARNESSES rather than set beside it: the
            # controllers refuse to start when an allowlisted model has no
            # enabled harness, so an OpenAI model may only be offered once
            # codex or copilot is elected. One variable cannot contradict
            # itself; two could. Copilot appears on both sides because it
            # brokers either vendor.
            #
            # The investigate/remediate stage defaults stay on the chart's
            # anthropic/claude-sonnet-5, which claude and copilot both run -
            # so a codex-ONLY election is the one combination that also has
            # to override agent.investigate.model and agent.remediate.model,
            # or the controllers refuse to start on a default they cannot
            # resolve.
            modelAllowlist: << $harnesses := splitList "," "${AGENT_HARNESSES:=claude}" >><< join "," (concat (ternary (list "anthropic/claude-sonnet-5" "anthropic/claude-opus-5") (list) (or (has "claude" $harnesses) (has "copilot" $harnesses))) (ternary (list "openai/gpt-5.3-codex" "openai/gpt-5.6-sol") (list) (or (has "codex" $harnesses) (has "copilot" $harnesses)))) | quote >>
            networkPolicy:
              # Which hostname-egress dialect the agent sandbox gets. `auto`
              # (the default) resolves it from the cluster's own API surface
              # on every helm-controller reconcile - FQDNNetworkPolicy on a
              # GKE Dataplane V2 cluster created with
              # --enable-fqdn-network-policy, CiliumNetworkPolicy on a real
              # Cilium (the EKS clusters), and the base NetworkPolicy alone
              # on anything else. That is what lets one manifest serve both
              # clouds.
              #
              # AGENT_EGRESS_POLICY pins it when detection is wrong or when a
              # render must be deterministic: none, cilium, gke or istio. The
              # app module knows the answer for certain on aws (the cluster
              # module installs Cilium) and publishes cilium; auto sees
              # nothing during an off-cluster `helm template`, which is why
              # `make test` renders `none`.
              mode: ${AGENT_EGRESS_POLICY:=auto}
              # Whenever a dialect above is enforcing, the chart drops the
              # base policy's "TCP 443 to anywhere" rule - policies are
              # additive, so leaving it would union with the allowlist and
              # make it decorative. Set AGENT_EGRESS_BROAD=always to keep it
              # while soaking a newly enabled mode: a mode that turns out not
              # to enforce then fails open instead of blackholing every
              # runner Job.
              broadEgress: ${AGENT_EGRESS_BROAD:=auto}
          # The egress credential broker: renders whenever the claude runner
          # is enabled and terminates ALL of that runner's model traffic,
          # holding the credential (or cloud identity) the agent pods no
          # longer see. Which provider it fronts is
          # agent.runners.claude.provider above.
          egressBroker:
            # the synced credential is a `claude setup-token` OAuth token,
            # sent as a bearer; set key on a cluster whose Secret Manager
            # container holds a real API key
            anthropicAuth: ${CLAUDE_ANTHROPIC_AUTH:=token}
            # always-on singleton like the controllers -> the system pool
            nodeSelector:
              role: system
            networkPolicy:
              # the cloud credential endpoint the broker's SDK dials, keyed
              # off the provider (which implies the cloud): the EKS Pod
              # Identity agent for bedrock, the GKE metadata server for
              # vertex; anthropic needs nothing beyond the chart's TCP-443
              # rule
              extraEgress: << if eq "${CLAUDE_PROVIDER:=anthropic}" "bedrock" >>[{"to":[{"ipBlock":{"cidr":"169.254.170.23/32"}}],"ports":[{"protocol":"TCP","port":80}]}]<< else if eq "${CLAUDE_PROVIDER:=anthropic}" "vertex" >>[{"to":[{"ipBlock":{"cidr":"169.254.169.254/32"}}],"ports":[{"protocol":"TCP","port":80}]}]<< else >>[]<< end >>
          # The controllers are small always-on singletons -> the system
          # pool; agent Jobs carry no selector and ride node
          # auto-provisioning.
          integrationController:
            nodeSelector:
              role: system
          sourceController:
            nodeSelector:
              role: system
          contextController:
            nodeSelector:
              role: system
            config:
              # Two extra keys at most: the mocked CMDB file (the per-cloud
              # overlay's static-context ConfigMap, mounted by the
              # postRenderer below), and - only on a cluster whose terraform
              # built the SCC pipeline - the Cloud Asset Inventory scope the
              # google-cloud-labels enhancer searches for a finding
              # resource's scm-repository-* ownership labels. An SCC
              # notification names a resource, never a repository, so the
              # scope is what makes those findings routable.
              #
              # The scope must match the cloudasset.viewer grant terraform
              # made, not exceed it: a search wider than the grant fails
              # rather than returning fewer results. It is organization-
              # scoped, matching the notification config - an app that
              # triages every project's findings has to reach every
              # project's resources - so the grant is org-level and lives
              # in the cloud-accounts common root, the only tier that can
              # write org IAM.
              #
              # Rendered as a flow mapping so PATCHY_GCP_ASSET_SCOPE is
              # ABSENT rather than empty without the pipeline (every SCC_*
              # var is a caller extra of the google patchy root, delivered
              # through patchy-vars, hence the := default): a bare quoted
              # dollar-brace scalar here would round-trip to null through
              # flux's post-build substitution when empty. The enhancer
              # chain is built from a non-empty scope alone, so the absent
              # key costs nothing and the CMDB enhancer still runs.
              extra: << if ne "${SCC_ASSET_SCOPE:=}" "" >>{"PATCHY_STATIC_CONTEXT_FILE":"/etc/patchy/context/cmdb.yaml","PATCHY_GCP_ASSET_SCOPE":"${SCC_ASSET_SCOPE:=}"}<< else >>{"PATCHY_STATIC_CONTEXT_FILE":"/etc/patchy/context/cmdb.yaml"}<< end >>
            serviceAccount:
              # Workload Identity impersonation of the SA holding that
              # org-level grant. The <pool>[<ns>/<ksa>] binding on it is made
              # by the patchy root; this annotation is the cluster-side half,
              # and without it the controller authenticates as the KSA itself
              # and every asset search 403s.
              #
              # Rendered as a flow mapping so the annotation is ABSENT rather
              # than empty on a cluster with no SCC pipeline: a key present
              # with an empty value would point Workload Identity at an SA
              # that does not exist. The scope above is empty there too, so
              # nothing ever asks for a Google token - but an annotation that
              # lies is worth avoiding even when it is never read.
              annotations: << if ne "${SCC_ASSET_SA:=}" "" >>{"iam.gke.io/gcp-service-account":"${SCC_ASSET_SA:=}"}<< else >>{}<< end >>
          investigationController:
            nodeSelector:
              role: system
          remediationController:
            nodeSelector:
              role: system
          # The evolve-facing remote-evaluation API (workspace upload,
          # submission, SSE monitoring) plus the reconcilers that run
          # submitted evaluation units as sandboxed agent Jobs. Off by
          # default (PATCHY_EVALUATION, the app module's evaluation input);
          # gated on dex too because the API has no unauthenticated
          # posture - without an issuer to point auth at, enabling it
          # could only fail the release. Enabling also renders the
          # source-controller's :9791 blob endpoint (workspace archives),
          # all chart-internal.
          evaluationController:
            enabled: << and (eq "${PATCHY_EVALUATION:=false}" "true") (has "dex" (splitList "," "${PLATFORM_COMPONENTS}")) >>
            # Inline rather than a synced Secret: evolve is a PUBLIC OIDC
            # client (authorization-code + PKCE, no client secret), so
            # this document contains nothing secret - the chart wraps it
            # in its own patchy-evaluation-auth Secret. No claims mapping:
            # the API's defaults (username=email, groups=groups) are
            # exactly the claims dex issues. The client itself is the
            # public DexClient evolve in resourceset-dex.yaml (id
            # patchy-evolve), registered by the platform's
            # dex-client-controller; evolve reads the id from the API.
            auth:
              config:
                mode: oidc
                oidc:
                  issuerURL: https://dex.${PLATFORM_DOMAIN}
                  clientID: patchy-evolve
            host: evals.${PATCHY_DOMAIN}
            httpRoute:
              # no separate gate: the compound guard on enabled above
              # already ties the route to dex being elected
              enabled: true
              parentRefs:
                - name: platform
                  namespace: gateway
            nodeSelector:
              role: system
            rbac:
              # render the chart's user-tier ClusterRole
              # (patchy-evaluations-submitter); rbac.yaml binds the
              # developers group onto it
              userRoles: true
            # Which harness runners may execute evaluation units. Same
            # AGENT_HARNESSES election as agent.runners above - one
            # variable keeps the evolve-runner fleet, the credential
            # Secrets, and the claude egress broker in lockstep. Images
            # stay on the chart defaults
            # (ghcr.io/bitwise-media-group/evolve-runner-<harness>).
            runners:
              claude:
                enabled: << has "claude" (splitList "," "${AGENT_HARNESSES:=claude}") >>
              codex:
                enabled: << has "codex" (splitList "," "${AGENT_HARNESSES:=claude}") >>
              copilot:
                enabled: << has "copilot" (splitList "," "${AGENT_HARNESSES:=claude}") >>
          statusServer:
            # the human edge, deliberately a separate hostname from the
            # webhook's: this one authenticates people, that one HMAC-signed
            # machines. OIDC sign-in through the platform dex opens the
            # findings board. No auth values here: the chart's auth mount is
            # post-rendered below into a projection of the patchy-status-auth
            # ConfigMap (config.yaml) and the status-dex-client Secret the
            # dex-client-controller generates (clientSecret, mounted as the
            # client-secret key clientSecretFile points at), both shipped by
            # resourceset-dex.yaml. Without dex in PLATFORM_COMPONENTS
            # neither exists, the mount is empty and the server drops to its
            # rollups-only posture: public statistics, no findings, no
            # sign-in.
            host: status.${PATCHY_DOMAIN}
            httpRoute:
              # the human edge only exists when dex can authenticate humans;
              # a dex-less cluster keeps the status server in-cluster only
              # (kubectl port-forward to reach). The webhook route above is
              # unaffected - machines authenticate by HMAC, not SSO.
              enabled: << has "dex" (splitList "," "${PLATFORM_COMPONENTS}") >>
              parentRefs:
                - name: platform
                  namespace: gateway
            nodeSelector:
              role: system
            rbac:
              # render the chart's user-tier ClusterRoles (findings-viewer/
              # approver/operator/admin); rbac.yaml binds the RBAC_GROUP_*
              # groups onto them
              userRoles: true
        # The chart has no extraVolumes knob, so the mocked CMDB is mounted
        # by patching the rendered context-controller Deployment, and the
        # status server's auth mount (a single Secret in the chart) becomes
        # a projection of the two objects resourceset-dex.yaml ships. On a
        # dex cluster the client Secret is required, so the pod waits for
        # the controller to generate it rather than starting with a
        # config.yaml whose clientSecretFile is missing; on a dex-less
        # cluster both sources are optional and absent.
        postRenderers:
          - kustomize:
              patches:
                - target:
                    kind: Deployment
                    name: patchy-status-server
                  patch: |
                    apiVersion: apps/v1
                    kind: Deployment
                    metadata:
                      name: patchy-status-server
                    spec:
                      template:
                        spec:
                          volumes:
                            - name: auth
                              secret: null
                              projected:
                                sources:
                                  - configMap:
                                      name: patchy-status-auth
                                      optional: true
                                  - secret:
                                      name: status-dex-client
                                      optional: << not (has "dex" (splitList "," "${PLATFORM_COMPONENTS}")) >>
                                      items:
                                        - key: clientSecret
                                          path: client-secret
                - target:
                    kind: Deployment
                    name: patchy-context-controller
                  patch: |
                    - op: add
                      path: /spec/template/spec/volumes/-
                      value:
                        name: static-context
                        configMap:
                          name: patchy-static-context
                    - op: add
                      path: /spec/template/spec/containers/0/volumeMounts/-
                      value:
                        name: static-context
                        mountPath: /etc/patchy/context
                        readOnly: true
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: patchy-config
        namespace: patchy
      spec:
        interval: 1h
        url: oci://ghcr.io/bitwise-media-group/patchy/charts/patchy-config
        provider: generic
        ref:
          # lockstep with the patchy chart: release-please stamps both charts
          # with the app version, so the one provider tag fits both
          tag: << inputs.tag >>
        verify:
          provider: cosign
          matchOIDCIdentity:
            # same helm.yaml workflow signs both charts; same GitHub-issuer
            # fallback for KMS-keyed clusters as the patchy chart above
            - issuer: '${SIGNED_IDENTITY_ISSUER:=^https://token\.actions\.githubusercontent\.com$}'
              subject: '${SIGNED_IDENTITY_PATCHY:=^https://github\.com/bitwise-media-group/patchy/}'
  # The pipeline switch-on - see the note at the top of this file for why
  # this one release is a text template while everything above is structured.
  resourcesTemplate: |
    ---
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: patchy-config
      namespace: patchy
    spec:
      interval: 30m
      timeout: 5m
      # the CRs cannot even be validated until the patchy release has
      # installed the CRDs; helm-controller holds this release until the
      # patchy HelmRelease is Ready
      dependsOn:
        - name: patchy
      chartRef:
        kind: OCIRepository
        name: patchy-config
        namespace: patchy
      values:
        # The controllers idle until an Integration (findings in, tracking
        # issues out) and a Forge (repository clone/push) exist. The github
        # pair reference the one synced patchy-github Secret (the per-cloud
        # overlay) - a single GitHub App serves read and write.
        integrations:
          - name: github
            spec:
              provider: github
              secretRef:
                name: patchy-github
              interval: 10m
              github:
                issues:
                  enabled: true
                  approveComment: /approve
                  << if ne "${PATCHY_FALLBACK_REPOSITORY:=}" "" >>
                  # Where a finding with no repository of its own gets its
                  # tracking issue. Cloud findings are the reason: most
                  # resources carry no scm-repository-* labels, and without a
                  # fallback those findings are visible only through kubectl
                  # and the status page. They still cannot be remediated -
                  # an issue is a human surface, not a work tree.
                  fallbackRepository: ${PATCHY_FALLBACK_REPOSITORY:=}
                  << end >>
                codeScanningAlerts:
                  enabled: true
          << if ne "${SCC_PUSH_SA:=}" "" >>
          # Security Command Center. Present only when terraform built the
          # pipeline (the google patchy root's scc.tf); SCC_PUSH_SA is the
          # whole gate, since a cluster with a push identity has all of the
          # facts and one without has none.
          #
          # No secretRef: this Integration holds no credential and calls no
          # Google API. SCC has no webhook, so a Pub/Sub push subscription
          # forwards each notification to /google-cloud/webhooks
          # authenticated by the OIDC token Pub/Sub signs. Anyone with a
          # Google account can mint a Google-signed token, so it is the
          # audience and the identity that make one meaningful - patchy
          # checks both and fails closed on either mismatch. Both come
          # straight from the terraform outputs rather than being recomposed
          # here: the audience happens to equal
          # https://integrations.<PATCHY_DOMAIN>/google-cloud/webhooks
          # today, but rebuilding a value that must match exactly, in a
          # second place, is how it silently stops matching.
          #
          # minSeverity is left at the chart default: the notification
          # config's own filter (active, unmuted, HIGH or above) already does
          # the volume control, and doing it twice hides which one dropped a
          # finding. Findings ingested here still need the github Integration
          # above for their tracking issues.
          - name: google-cloud
            spec:
              provider: google-cloud
              interval: 10m
              googleCloud:
                securityCommandCenter:
                  enabled: true
                  # presence-gated separately from the SCC_PUSH_SA gate
                  # above: the CRD requires minLength 1, so an empty string
                  # is as fatal as an absent key - if terraform ever
                  # publishes the push identity without the audience, fail
                  # on the missing required field, not on an empty one
                  << if ne "${SCC_AUDIENCE:=}" "" >>
                  audience: ${SCC_AUDIENCE:=}
                  << end >>
                  serviceAccount: ${SCC_PUSH_SA:=}
                  # numeric org id, for composing Console links on findings
                  # that carry no externalUri
                  organization: "${SCC_ORGANIZATION:=}"
          << end >>
        forges:
          - name: github
            spec:
              provider: github
              secretRef:
                name: patchy-github
              interval: 10m
