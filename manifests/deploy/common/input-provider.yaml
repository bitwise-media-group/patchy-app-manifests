apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: patchy
  namespace: patchy
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 30m
spec:
  # generic OCI, not the platform registry's tag provider: the chart lives
  # on ghcr (anonymously pullable), not the platform mirror
  type: OCIArtifactTag
  url: oci://ghcr.io/bitwise-media-group/patchy/charts/patchy
  filter:
    # chart tags are bare chart versions (e.g. 0.7.0); chart version tracks
    # the app version 1:1 and the image tag defaults to v<version>. The
    # floor is 0.10.1, and every step of the way down is a hard failure
    # rather than a degraded render:
    #   < 0.10.1 no evaluationController values surface - the strict schema
    #            fails the release outright, even with enabled: false, so
    #            the floor is unconditional rather than eval-gated.
    #   < 0.10.0 no agent.runners.claude.provider or egressBroker values -
    #            the strict schema (additionalProperties: false) fails the
    #            release outright - and the anthropic Secret moved from
    #            patchy-agents to patchy for the broker, so an old chart
    #            under these manifests would also strand the credential.
    #   < 0.7.0  the model registry predates Opus 5 and the GPT-5.6 tiers,
    #            so the ids agent.modelAllowlist derives are rejected at
    #            controller startup.
    #   < 0.5.7  no agent.runners map at all - the per-harness split
    #            replaced the single anthropic.* block, and the strict
    #            values schema fails the release outright.
    #   < 0.5.0  no patchy-config chart to carry the Integration/Forge CRs
    #            (and the 0.4.0 patchy chart cannot fresh-install its own
    #            CRs anyway); before that the 0.4.0 CRD-stack refactor
    #            renamed the values surface wholesale.
    # Constraint order matters: kustomize drops the quotes, so the default
    # must not start with '>' or YAML reads it as a folded block scalar.
    semver: "${PATCHY_SEMVER:=<1.0.0 >=0.10.1}"
    limit: 1
