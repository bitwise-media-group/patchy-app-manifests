# The mocked CMDB the context-controller reads (PATCHY_STATIC_CONTEXT_FILE
# in the patchy core's HelmRelease values; mounted by its postRenderer
# patch). The parser is strict -- unknown keys are a startup error and
# attribute values must be strings.
apiVersion: v1
kind: ConfigMap
metadata:
  name: patchy-static-context
  namespace: patchy
data:
  cmdb.yaml: |
    repos:
      bitwisemedia/golang-scenarios:
        owners:
          - dmccaffery
          - irishredbeard
        attributes:
          cloud: google
          project: x-patchy-12ad
          environment: prod
          internet-facing: "true"
