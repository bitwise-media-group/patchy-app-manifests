#
# The google tree (what the seed applies on GKE): the cloud-neutral core,
# the google secret-sync dialect (GKE Integrated
# Secret Synchronization, run as the patchy-secrets KSAs whose accessor
# grants the app module makes), and the GKE Gateway health-check policies
# the managed load balancer needs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../common
  - service-accounts.yaml
  - static-context.yaml
  - resourceset-secrets.yaml
  - health-check.yaml
  - resourceset-health-check.yaml
