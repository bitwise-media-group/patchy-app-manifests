# Release pipeline — thin caller for the org's reusable release workflow.
# release-please watches main and keeps a release PR current from the
# Conventional Commit history; when that PR merges the workflow cuts the GitHub
# release + vX.Y.Z tag. There is no .goreleaser.yaml here: the publish job
# after it runs the patchy-publish action, which publishes every push that cuts
# no release as an immutable edge build of manifests/patchy and promotes the
# newest edge build to vX.Y.Z when a release is cut. The reusable workflow's docs job
# sees zensical.toml and publishes the documentation site, built at the release
# tag, to GitHub Pages (oss.bitwisemedia.uk/patchy-app-manifests/; needs
# Settings -> Pages -> Source -> GitHub Actions).
#
# app-client-id/app-private-key author the release-please PR as the "FF Merge"
# App instead of the GITHUB_TOKEN. A GITHUB_TOKEN-authored push fires no
# workflow_run, so a release PR opened that way never triggers the auto-merge in
# merge.yaml; authoring it as the App makes the release PR auto-merge once
# approved and green, like any other.
#
# The reusable workflow is pinned to a full commit SHA (tag in the comment) so a
# moved tag can never change what runs; Renovate keeps the pin fresh.
name: Release

on:
    push:
        branches: [main]
    # allow cutting a release manually from the Actions tab
    workflow_dispatch:

permissions: {}

jobs:
    release:
        uses: bitwise-media-group/github-workflows/.github/workflows/release.yaml@67215effe1e541e699905fb62b7a48b7293f935c # v8.3.0
        # ceiling for the reusable workflow's release-please job. GitHub resolves
        # a reusable workflow's permissions as the union of every job and ignores
        # `if:`, so the caller grants the goreleaser job's ceiling even though it
        # is skipped here (no .goreleaser.yaml).
        permissions:
            # create the release/tag and upload assets
            contents: write
            # release-please creates pr labels via the issues api
            issues: write
            # release-please opens the release pull request
            pull-requests: write
            # cosign keyless signing (goreleaser; skipped in this repo), and the
            # OIDC token the docs job's deploy-pages exchanges for the deploy
            id-token: write
            # push container images to ghcr (goreleaser; skipped in this repo)
            packages: write
            # github build-provenance attestation (skipped in this repo)
            attestations: write
            # artifact storage record for the attestation (skipped in this repo)
            artifact-metadata: write
            # publish the documentation site's GitHub Pages deployment (docs job)
            pages: write
        with:
            # author the release PR as the FF Merge App so it can auto-merge (a
            # GITHUB_TOKEN-authored push fires no workflow_run to trigger the merge)
            app-client-id: ${{ vars.FF_MERGE_CLIENT_ID }}
        secrets:
            # private key for the App that authors the release PR (same App as /merge)
            app-private-key: ${{ secrets.FF_MERGE_PRIVATE_KEY }}

    # The manifests image (patchy.yaml), in this repository's own job: a
    # composite action keeps the job's identity, so the image is signed as
    # .../patchy-app-manifests/.github/workflows/release.yaml@refs/heads/main,
    # the identity clusters verify (the seed's signed_identity_subject). Registries
    # and signing come from org variables (GOOGLE_MANIFEST_PUBLISHER_SA is this
    # repository's own); nothing about them is committed.
    publish:
        needs: release
        runs-on: ubuntu-latest
        # one publish at a time, in push order: an edge build never lands
        # after the promotion of a release cut from a later commit
        concurrency:
            group: patchy-publish
            cancel-in-progress: false
        permissions:
            # check out the source to build
            contents: read
            # the GCP login and keyless signing ride the job's OIDC token
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  submodules: true # the toolchain at .mise/ pins patchy and cosign

            - uses: bitwise-media-group/github-workflows/.github/actions/patchy-publish@67215effe1e541e699905fb62b7a48b7293f935c # v8.3.0
              with:
                  mode: ${{ needs.release.outputs.release_created == 'true' && 'promote' || 'edge' }}
                  version: ${{ needs.release.outputs.release_created == 'true' && needs.release.outputs.version || '' }}
                  google-registry: ${{ vars.GOOGLE_PLATFORM_REGISTRY }}
                  google-workload-identity-provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
                  google-service-account: ${{ vars.GOOGLE_MANIFEST_PUBLISHER_SA }}
                  aws-registry: ${{ vars.AWS_PLATFORM_REGISTRY }}
                  aws-role: ${{ vars.AWS_MANIFEST_PUBLISHER_ROLE }}
                  aws-region: ${{ vars.AWS_REGION }}
                  signing-kms-key: ${{ vars.SIGNING_KMS_KEY }}
