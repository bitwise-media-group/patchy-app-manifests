# Publish - push the released manifests as the oci://<registry>/manifests/patchy
# image to every platform registry, sign each digest keylessly, and move the
# `staging` channel tag. Runs when release-please cuts a release (App-authored,
# so the event fires); clusters whose seed semver range admits the new version
# pick it up on the next ResourceSetInputProvider reconcile - the seed follows
# version tags, never the channel tags, so `staging`/`stable` exist for humans
# and for pinning a cluster deliberately (PATCHY_MANIFESTS_SEMVER).
#
# One job, two registries: the GAR half authenticates through Workload
# Identity Federation as this repo's manifest-publisher service account; the
# ECR half assumes this repo's manifest-publisher role (the artifact-store
# module's manifest_publishers["patchy-app-manifests"], path-scoped to
# manifests/patchy) and is skipped when the org variable is unset. The Fulcio
# identity every cluster pins is this workflow at its release tag
# (.../patchy-app-manifests/.github/workflows/publish.yaml@refs/tags/v*).
name: Publish Manifests

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # WIF / AWS OIDC token exchange + cosign keyless all ride the job's OIDC token
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the image is built from the release tag, not a branch head
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: install flux CLI
        uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: authenticate to Google Cloud
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          # this repo's own publisher SA (a repo variable shadowing the org one)
          service_account: ${{ vars.GCP_MANIFEST_PUBLISHER_SA }}
          token_format: access_token

      - name: log in to the GAR platform registry
        env:
          ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          PLATFORM_REGISTRY: ${{ vars.PLATFORM_REGISTRY }}
        run: |
          set -euo pipefail
          # writes ~/.docker/config.json - the keychain flux push and cosign read
          docker login "${PLATFORM_REGISTRY%%/*}" --username oauth2accesstoken --password-stdin <<<"$ACCESS_TOKEN"

      - name: authenticate to AWS
        if: vars.AWS_MANIFEST_PUBLISHER_ROLE != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_MANIFEST_PUBLISHER_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: log in to the ECR platform registry
        if: vars.AWS_MANIFEST_PUBLISHER_ROLE != ''
        env:
          AWS_PLATFORM_REGISTRY: ${{ vars.AWS_PLATFORM_REGISTRY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login "${AWS_PLATFORM_REGISTRY%%/*}" --username AWS --password-stdin

      - name: push, sign, move staging
        env:
          REGISTRIES: ${{ vars.PLATFORM_REGISTRY }} ${{ vars.AWS_MANIFEST_PUBLISHER_ROLE != '' && vars.AWS_PLATFORM_REGISTRY || '' }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          echo "## Published patchy manifests $version" >> "$GITHUB_STEP_SUMMARY"
          ./scripts/publish.sh push "$version" "$TAG@sha1:$GITHUB_SHA"
          ./scripts/publish.sh tag "$version" staging
