# Publish Edge - push every merge to main as the `edge` channel of the patchy
# manifests image, signed keylessly like the release channels. Dev/sandbox
# clusters that pin PATCHY_MANIFESTS_SEMVER to a prerelease range cannot
# follow a channel tag (the seed lists version tags only), so edge exists for
# `flux pull artifact` inspection and for the platform's own smoke tests;
# `staging` and `stable` only ever see release-tagged images.
#
# A separate workflow file on purpose: the Fulcio certificate subject is the
# workflow path + ref, so edge images are signed as
# .../patchy-app-manifests/.github/workflows/publish-edge.yaml@refs/heads/main -
# a distinct identity from publish.yaml@refs/tags/v*. The image is pushed as
# edge-next, signed, and only then retagged edge, so the channel never points
# at an unsigned digest.
name: Publish Edge Manifests

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: publish-edge
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install flux CLI
        uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: authenticate to Google Cloud
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_MANIFEST_PUBLISHER_SA }}
          token_format: access_token

      - name: log in to the GAR platform registry
        env:
          ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          PLATFORM_REGISTRY: ${{ vars.PLATFORM_REGISTRY }}
        run: |
          set -euo pipefail
          docker login "${PLATFORM_REGISTRY%%/*}" --username oauth2accesstoken --password-stdin <<<"$ACCESS_TOKEN"

      - name: authenticate to AWS
        if: vars.AWS_MANIFEST_PUBLISHER_ROLE != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_MANIFEST_PUBLISHER_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: log in to the ECR platform registry
        if: vars.AWS_MANIFEST_PUBLISHER_ROLE != ''
        env:
          AWS_PLATFORM_REGISTRY: ${{ vars.AWS_PLATFORM_REGISTRY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login "${AWS_PLATFORM_REGISTRY%%/*}" --username AWS --password-stdin

      - name: push, sign, move edge
        env:
          REGISTRIES: ${{ vars.PLATFORM_REGISTRY }} ${{ vars.AWS_MANIFEST_PUBLISHER_ROLE != '' && vars.AWS_PLATFORM_REGISTRY || '' }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          echo "## Published patchy manifests edge (main@sha1:$GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
          ./scripts/publish.sh push edge-next "main@sha1:$GITHUB_SHA"
          ./scripts/publish.sh tag edge-next edge
