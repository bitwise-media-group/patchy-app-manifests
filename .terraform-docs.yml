# terraform-docs configuration: `terraform-docs .` regenerates the block
# between the BEGIN_TF_DOCS / END_TF_DOCS markers in each modules/* README.md.
formatter: markdown table

recursive:
  enabled: true
  path: modules
  include-main: false

output:
  file: README.md
  mode: inject

sort:
  enabled: true
  by: required

settings:
  anchor: false
  lockfile: false
