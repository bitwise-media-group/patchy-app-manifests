# The patchy-app-manifests documentation site (Zensical via uv). Not a Python
# package: no [build-system], so the python archetype's build runs only
# `zensical build`.
[project]
name = "patchy-app-manifests-docs"
version = "0.1.0"
description = "Documentation site for the BitWise Media Group patchy application image and its terraform installers, built with Zensical."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BitWise Media Group Ltd.", email = "oss@bitwisemedia.uk" }]
dependencies = [
  "zensical>=0.0.69",
]
