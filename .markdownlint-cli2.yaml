# Repo-local copy of the toolchain house default (.mise/.markdownlint-cli2.yaml)
# with one delta: the terraform-docs module READMEs are ignored, exactly as
# they are in .prettierignore. terraform-docs owns the block between the
# BEGIN_TF_DOCS / END_TF_DOCS markers and regenerates it verbatim (inline
# <br/> cells included), so only one of the two tools can own those files.
# yaml-language-server: $schema=https://raw.githubusercontent.com/DavidAnson/markdownlint-cli2/refs/heads/main/schema/markdownlint-cli2-config-schema.json
config:
  default: true
  # keep prose readable in terminals and diffs; tables are exempt.
  line-length:
    line_length: 120
    tables: false
  no-duplicate-heading:
    siblings_only: true
  code-block-style:
    style: fenced

globs:
  - "**/*.md"

ignores:
  - "node_modules/**"
  # the toolchain library submodule (its prose is linted in its own repo)
  - ".mise/**"
  - ".venv/**"
  - ".claude/**"
  # machine-written by release-please, not house prose
  - "CHANGELOG.md"
  # owned by terraform-docs (see the header) - same set as .prettierignore
  - "modules/*/README.md"
