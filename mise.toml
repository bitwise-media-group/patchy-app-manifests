#
# patchy-app-manifests consumes the shared toolchain
# (bitwise-media-group/toolchain) as the .mise/ submodule: mise loads its
# config.toml natively as .mise/config.toml (pinned tools -- terraform,
# kubescape, shellcheck, actionlint, zizmor, prettier, markdownlint,
# addlicense, ... -- and the [vars] knob defaults), and this file selects the
# task files and pins the validation-only tools below. The repo has nothing to
# compile, so it includes common only; the Makefile is a thin forwarder
# (.mise/common/include.mk). The validation task surface lives in tasks.toml.

[task_config]
# common (prose fmt/lint + license, container, shell and workflow lint), then
# the repo-local validation tasks; tasks.toml is included AFTER common so its
# same-named tasks (fmt, lint-kustomize, ci, pr) win.
includes = [".mise/common/tasks.toml", "tasks.toml"]

[tools]
# Validation tools the toolchain does not pin (the same set flux-manifests
# pins; locked in this repo's own mise.lock - never run a repo-wide
# `mise upgrade`, it would write into the submodule). terraform, for the
# modules' plan-time test suites, is the toolchain's shared pin.
"aqua:kubernetes-sigs/kustomize" = "5.7.1"
"aqua:yannh/kubeconform" = "0.8.0"
"aqua:mikefarah/yq" = "4.54.1"
# renders ResourceSets with sample inputs (`flux-operator build resourceset`)
"github:controlplaneio-fluxcd/flux-operator" = "v0.61.0"
