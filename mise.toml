#
# patchy-app-manifests consumes the shared toolchain
# (bitwise-media-group/toolchain) as the .mise/ submodule: mise loads its
# config.toml natively as .mise/config.toml (the pinned tools and the [vars]
# knob defaults), and this file selects the task files. The containers
# archetype publishes the manifests image with `patchy build` (patchy.yaml)
# and pins everything the validation harness needs — kustomize, kubeconform,
# yq, flux-operator, kubescape, terraform — as shared pins, so this repo pins
# nothing of its own. tasks.toml adds the harness and the module tests; the
# Makefile is a thin forwarder (.mise/archetypes/containers/include.mk).

[task_config]
# common (prose fmt/lint + license, container, shell and workflow lint, the
# docs site), then the containers archetype (build, publish, the rollups),
# then the repo-local tasks; tasks.toml is included LAST so its same-named
# tasks (lint-kustomize, fmt, test, ci, pr) win over both.
includes = [".mise/common/tasks.toml", ".mise/archetypes/containers/tasks.toml", "tasks.toml"]
